stages:
  - build
  - test
  - publish
  - trigger_prep
  - trigger

include:
  - project: Northern.tech/Mender/mendertesting
    file:
      - qa-common/runner.yml
      - qa-common/retry.yml
  - project: "Northern.tech/Mender/mendertesting"
    file: ".gitlab-ci-check-golang-lint.yml"
  - project: "Northern.tech/Mender/mendertesting"
    file: ".gitlab-ci-github-status-updates.yml"
  - component: gitlab.com/Northern.tech/Mender/mendertesting/commit-lint@master
  - component: gitlab.com/Northern.tech/Mender/mendertesting/backwards-compatible-yocto@master
  - project: "Northern.tech/Mender/mendertesting"
    file: ".gitlab-ci-check-license.yml"
  - component: gitlab.com/Northern.tech/Mender/mendertesting/brew-build@master
    inputs:
      formula: "m/mender-artifact.rb"

  # Release CI/CD components
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-candidate@master
    inputs:
      github_repo: mendersoftware/mender-artifact
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-mender-docs@master
    inputs:
      component: mender-artifact
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-dist-packages@master
    inputs:
      package: MENDER_ARTIFACT
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-compass@master
    inputs:
      compass_component_id: "3a6f19a5-306f-4900-93f6-c2e953eac6e8"
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-oslicenses-golang@master
    inputs:
      remote_license_file: "302.Release-information/04.Open-source-licenses/30.mender-artifact/docs.md"
  - component: gitlab.com/Northern.tech/Mender/mendertesting/release-docs-changelog@master
    inputs:
      remote_changelog_file: "30.mender-artifact/docs.md"

default:
  tags: !reference [.qa-common-default-runner, tags]
  retry: !reference [.qa-common-default-retry, retry]

cache:
  paths:
    - /go/src/github.com
    - /go/src/golang.org
    - /go/src/google.golang.org
    - /go/src/gopkg.in

variables:
  DEFAULT_BRANCH: "master"
  S3_BUCKET_NAME: "mender"
  S3_BUCKET_PATH: "mender-artifact"
  AWS_S3_PUBLISH_ROLE_ARN: "arn:aws:iam::175683096866:role/nt-mender-artifact-s3-publishing"
  DOCKER_BUILDKIT: 1
  INSTALL_BREW:
    value: false
    description: |
      Run a job to install and test mender-artifact
      with brew from upstream.

.build:base:
  before_script:
    - make get-build-deps
  retry:
    max: 2
    exit_codes:
      - 137
      - 192
      - 125
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

test:check-license-source:
  variables:
    LICENSE_HEADERS_IGNORE_FILES_REGEXP: './artifact/keyfactor/\(signer\|signer_test\)\.go'

build:make:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.27-trixie
  extends: .build:base
  needs: []
  stage: build
  script:
    - make build-natives
  artifacts:
    expire_in: 2w
    paths:
      - mender-artifact-*

build:coverage:
  stage: build
  extends: .build:base
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.27-trixie
  needs: []
  before_script:
    - make get-build-deps
  script:
    - make build-cover
    - mv mender-artifact mender-artifact-linux-coverage
  artifacts:
    expire_in: 2w
    paths:
      - mender-artifact-linux-coverage

test:smoketests:mac:
  stage: test
  needs:
    - job: build:make
      artifacts: true
  before_script:
    - export TEST_MENDER_ARTIFACT_PATH=./mender-artifact-darwin
  script:
    - touch test.txt
    - ./mender-artifact-darwin
    - ./mender-artifact-darwin --version
    - ./mender-artifact-darwin write module-image -c test -o test.mender -T script -n test -f test.txt
    - ./mender-artifact-darwin read test.mender
    - ./mender-artifact-darwin validate test.mender
    - ./mender-artifact-darwin write rootfs-image -c test -o test-rfs.mender -n test -f test.txt
    - ./mender-artifact-darwin read test-rfs.mender
    - ./mender-artifact-darwin validate test-rfs.mender
    - ./mender-artifact-darwin validate --key tests/data/ec.pem tests/data/a0-signed-nitro.mender
    - ./tests/test_compressions/test_supported_compressions.sh
    - make build
  tags:
    - mac-arm-runner

test:smoketests:linux:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/debian:trixie-slim
  needs:
    - job: build:make
      artifacts: true
  before_script:
    - !reference [.qa-common-network-apt-retry, before_script]
    - apt-get update && apt-get install -q -y make liblzma-dev libssl-dev jq wget
    # yq no longer has a maintained debian repo so we fall back on the GitHub release as the source
    - wget -q https://github.com/mikefarah/yq/releases/download/v4.44.2/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - ./tests/test_sign_with_hsm/test_sign_with_hsm.sh --setup
    - export TEST_MENDER_ARTIFACT_PATH=./mender-artifact-linux
  script:
    - touch test.txt
    - ./tests/test_sign_with_hsm/test_sign_with_hsm.sh
    - ./mender-artifact-linux
    - ./mender-artifact-linux --version
    - ./mender-artifact-linux write module-image -c test -o test.mender -T script -n test -f test.txt
    - ./mender-artifact-linux read test.mender
    - ./mender-artifact-linux validate test.mender
    - ./mender-artifact-linux write rootfs-image -c test -o test-rfs.mender -n test -f test.txt
    - ./mender-artifact-linux read test-rfs.mender
    - ./mender-artifact-linux validate test-rfs.mender
    - ./mender-artifact-linux validate --key tests/data/ec.pem tests/data/a0-signed-nitro.mender
    - test $(./mender-artifact-linux read --no-progress test-rfs.mender | yq eval -o json | jq -r '."Mender Artifact".Name') == "test"
    - ./tests/test_compressions/test_supported_compressions.sh

test:coverage:linux:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.27-trixie
  needs:
    - job: build:coverage
      artifacts: true
  variables:
    COVERAGE_FILE: coverage-linux-pkcs.txt
    GOCOVERDIR: coverage
  before_script:
    - ./tests/test_sign_with_hsm/test_sign_with_hsm.sh --setup
    - export TEST_MENDER_ARTIFACT_PATH=./mender-artifact-linux-coverage
    - mkdir --parents ${GOCOVERDIR}
  script:
    - ./tests/test_sign_with_hsm/test_sign_with_hsm.sh
    - go tool covdata textfmt -i ${GOCOVERDIR} -o ${COVERAGE_FILE}
  artifacts:
    expire_in: 2w
    untracked: true
    paths:
      - ${COVERAGE_FILE}

.test:unit:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.27-trixie
  needs: []
  script:
    - make coverage
    - mv coverage.txt $CI_PROJECT_DIR/$COVERAGE_FILE
  artifacts:
    expire_in: 2w
    untracked: true
    paths:
      - $COVERAGE_FILE

test:unit:linux:
  extends: .test:unit
  variables:
    COVERAGE_FILE: coverage-linux.txt
  before_script:
    - !reference [.qa-common-network-apt-retry, before_script]
    - apt-get update && apt-get install --quiet --assume-yes
      git make bash dosfstools e2fsprogs gcc mtools musl-dev parted xz-utils libssl-dev

test:unit:mac:
  extends: .test:unit
  # Override image since mac-arm-runner is a shell executor, not Docker
  image: null
  variables:
    COVERAGE_FILE: coverage-mac.txt
    # This is needed because the host is reusing the workdir, it is not a Docker
    # runner.
    GIT_STRATEGY: clone
  tags:
    - mac-arm-runner
  before_script:
    # fsck.ext4 is required for the tests
    # From some reason brew does not installed e2fsprogs
    # correct and has not created valid links. This is the reason
    # why we are forcing to reinstall it
    - brew reinstall e2fsprogs
  after_script:
    # we want a clean environment on the runner for testing `brew install
    # mender-artifact` (which pulls `e2fsprogs`, among others, as a dependency)
    # XXX: brew is broken right now so we need to leave this in place for `brew
    #      test mender-artifact` to work
    # - brew remove e2fsprogs

test:install:brew:
  stage: test
  tags:
    - mac-arm-runner
  before_script:
    # These are genuine dependencies, but somehow brew doesn't install them
    # automatically for `brew test` below.
    - brew install ca-certificates openssl@3
  script:
    # Reinstall in case we already have mender-artifact
    - brew reinstall mender-artifact
    # Refresh cache for new versions
    - brew update
    - brew test mender-artifact

# Local override of the `test:build:brew` job from the brew-build component
# (gitlab.com/Northern.tech/Mender/mendertesting/brew-build).
test:build:brew:
  # The component's script installs/tests the generated formula by file path
  # (`brew reinstall --formula ./mender-artifact.rb`). Homebrew 7.0 removed
  # path-based package loading entirely (always disabled, even with
  # HOMEBREW_DEVELOPER=1; HOMEBREW_FORBID_PACKAGES_FROM_PATHS is now a no-op),
  # so brew strips the path to the bare name "mender-artifact", fails to find it
  # in any tap, and errors with "No available formula with the name
  # mender-artifact". We override script/after_script to build the same formula
  # but install it from a local, ephemeral tap by its tap-qualified name, which
  # is still a valid lookup. Only script/after_script are overridden; the
  # component's rules/tags/retry/variables are inherited. If this holds up, fold
  # it into the shared brew-build component.
  # Mirrors the component's script 1:1 so it can be folded back into the component
  # with minimal edits; only step 4 and the extra untap in after_script differ.
  # When porting to the component, un-resolve the three inlined inputs back to
  # interpolation: `m/mender-artifact.rb` -> `$[[ inputs.formula ]]` (used in the
  # basename below and the step-2 URL) and `""` -> `$[[ inputs.repo ]]` (the REPO
  # line below). The empty string here is inputs.repo's default (no repo input is
  # passed for mender-artifact), so the `|| REPO=...` branch is a no-op.
  script:
    - FORMULA_FILE="$(basename m/mender-artifact.rb)"
    - FORMULA_NAME="${FORMULA_FILE%%.*}"
    - REPO="$FORMULA_NAME"
    - test -z "" || REPO=""
    - TEMP_BUILD_DIR="/tmp/brew_build_${CI_PIPELINE_ID}"
    - mkdir "$TEMP_BUILD_DIR"
    - cd "$TEMP_BUILD_DIR"
    # 1. get the custom download strategy for brew so that we can fetch a PR revision from GH
    - wget -O $FORMULA_FILE https://raw.githubusercontent.com/mendersoftware/mendertesting/master/gh_pr_brew_dl_strategy.rb
    - echo >> $FORMULA_FILE # Make sure there's a newline after download strategy class
    # 2. fetch the upstream brew formula
    - wget -O ${FORMULA_NAME}_upstream.rb "https://github.com/Homebrew/homebrew-core/raw/refs/heads/main/Formula/m/mender-artifact.rb"
    # 3. adapt the formula to use the PR revision instead of a release tarball
    - |
        gsed -e /sha256/d -e "/url /s|\".*\"|\"https://github.com/mendersoftware/${REPO}.git\",|" -e "/url \"https/a\ \ \ \ revision: \"${CI_COMMIT_SHA}\",\n    using: GitHubPRDownloadStrategy\n  version \"1234\"" < ${FORMULA_NAME}_upstream.rb >> $FORMULA_FILE
    # 3b. provenance: show the revision we are about to build and the generated
    #     formula, so the log proves which commit brew is told to fetch. Compare this
    #     SHA against the "==> Fetching PR revision <sha>" line the download strategy
    #     prints during the install below.
    - echo "=== building ${FORMULA_NAME} from revision ${CI_COMMIT_SHA} (pipeline ${CI_PIPELINE_ID}) ==="
    - echo "=== generated formula ${FORMULA_FILE} ===" && cat $FORMULA_FILE
    # 4. run brew build and test from a local, ephemeral tap. The component installs
    #    by file path (`--formula ./${FORMULA_FILE}`), which brew 7.0 rejects.
    - TAP="mender/local"
    - TAP_DIR="$(brew --repository)/Library/Taps/mender/homebrew-local"
    - brew tap-new --no-git "$TAP"
    - mkdir -p "$TAP_DIR/Formula"
    - cp "$FORMULA_FILE" "$TAP_DIR/Formula/$FORMULA_FILE"
    - HOMEBREW_NO_INSTALL_FROM_API=1 brew reinstall --build-from-source --verbose --formula "${TAP}/${FORMULA_NAME}" < /dev/null
    # 4b. provenance: confirm the binary that was just built and installed from source
    #     (not poured from a bottle) and that it runs.
    - echo "=== installed from (should be a source build, version 1234): ==="
    - brew info "${TAP}/${FORMULA_NAME}" | head -n 5
    - BIN="$(brew --prefix)/bin/${FORMULA_NAME}"
    - echo "=== ${BIN} --version ===" && "$BIN" --version
    - brew test "${TAP}/${FORMULA_NAME}"
  after_script:
    - FORMULA_FILE="$(basename m/mender-artifact.rb)"
    - FORMULA_NAME="${FORMULA_FILE%%.*}"
    - brew remove $FORMULA_NAME || true
    - brew untap mender/local || true
    - rm -rf "/tmp/brew_build_${CI_PIPELINE_ID}"

publish:tests:
  stage: publish
  allow_failure: true
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.27
  needs:
    - job: test:unit:linux
      artifacts: true
    - job: test:unit:mac
      artifacts: true
    - job: test:coverage:linux
      artifacts: true
  before_script:
    - curl -Os https://cli.codecov.io/latest/linux/codecov
    - chmod +x codecov
  script:
    - if [[ -f coverage-linux.txt && -f coverage-linux-pkcs.txt ]]; then tail -n +2 coverage-linux-pkcs.txt >> coverage-linux.txt; fi
    - PR_FLAG=$(echo "${CI_COMMIT_BRANCH}" | grep -q '^pr_' && echo "--pr $(echo "${CI_COMMIT_BRANCH}" | sed 's/^pr_//')" || echo "")
    - for PLATFORM in linux mac; do
    - ./codecov upload-process
      --fail-on-error
      --git-service github
      --slug mendersoftware/${CI_PROJECT_NAME}
      --sha ${CI_COMMIT_SHA}
      ${PR_FLAG}
      --file coverage-${PLATFORM}.txt
      --flag unittests-${PLATFORM}
    - done

.aws-oidc-auth: &aws-oidc-auth
  - >
    export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
    $(aws sts assume-role-with-web-identity
    --role-arn ${AWS_S3_PUBLISH_ROLE_ARN}
    --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
    --web-identity-token ${AWS_OIDC_TOKEN}
    --duration-seconds 900
    --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
    --output text))
  - aws sts get-caller-identity

publish:s3:
  stage: publish
  image: registry.gitlab.com/northern.tech/mender/mender-test-containers/base-debian:master
  rules:
    # Publish for build and final tags + default and maintenance branches
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-build\d+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^\d+\.\d+\.x$/'
    - if: $CI_COMMIT_BRANCH == $DEFAULT_BRANCH
  needs:
    - job: build:make
      artifacts: true
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - *aws-oidc-auth
  script:
    - echo "Publishing ${CI_COMMIT_REF_NAME} version for windows to S3";
      aws s3 cp mender-artifact-windows.exe
      s3://$S3_BUCKET_NAME/$S3_BUCKET_PATH/${CI_COMMIT_REF_NAME}/windows/mender-artifact;
      aws s3api put-object-acl --acl public-read --bucket $S3_BUCKET_NAME
      --key $S3_BUCKET_PATH/${CI_COMMIT_REF_NAME}/windows/mender-artifact;
